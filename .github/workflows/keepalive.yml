name: Keep Render awake

# Render's free tier sleeps after 15 minutes without inbound HTTP traffic.
# A request to /health every 5 minutes keeps the polling bot running.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping health endpoint
        run: curl -fsS --max-time 90 --retry 2 --retry-delay 5 https://salah-bot-8nt7.onrender.com/health
